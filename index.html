<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financeiro</title>
<meta name="theme-color" content="#12344D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Diário financeiro. Papel, folha, tinta, azul-petróleo, laranja de ação, framboesa para saídas. */
:root{
  --bg:#EDF1F4;--surface:#FFFFFF;--ink:#10222D;--muted:#586A76;--line:#D5DDE3;--soft:#F1F4F7;
  --accent:#1A5F7A;--accent-text:#1A5F7A;--band:#12344D;--sinal:#FF8A3D;--sinal-ink:#2A1200;
  --in:#17805A;--out:#C92C55;--accent-ink:#FFFFFF;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0C1318;--surface:#151E25;--ink:#E4ECF1;--muted:#8FA1AD;--line:#26333D;--soft:#1B272F;
    --accent:#3E9CBF;--accent-text:#74C0DE;--band:#0B2231;--sinal:#FF9A57;--in:#4FD1A0;--out:#FF7096}
}
:root[data-theme="dark"]{--bg:#0C1318;--surface:#151E25;--ink:#E4ECF1;--muted:#8FA1AD;--line:#26333D;--soft:#1B272F;
  --accent:#3E9CBF;--accent-text:#74C0DE;--band:#0B2231;--sinal:#FF9A57;--in:#4FD1A0;--out:#FF7096}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);overflow-x:clip;
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sinal);outline-offset:2px;box-shadow:0 0 0 4px var(--ink)}
.num,.val{font-family:var(--cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--in)}.out{color:var(--out)}.muted{color:var(--muted)}
h1,h2{font-family:var(--cond);margin:0}
h2{font-size:1.3rem;font-weight:600;letter-spacing:.005em;line-height:1.15}

/* faixa superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:#fff;display:flex;align-items:stretch;gap:1.8rem;padding:0 1.5rem;min-height:3.4rem}
.brand{display:flex;align-items:center;gap:.5rem;font-family:var(--cond);font-weight:700;font-size:1.45rem;letter-spacing:.01em}
.brand svg{width:20px;height:22px;color:var(--sinal)}
.tabs{display:flex;gap:.3rem}
.tabs button{display:flex;align-items:center;gap:.4rem;background:none;border:0;border-bottom:3px solid transparent;border-top:3px solid transparent;padding:0 .7rem;font-weight:600;color:rgba(255,255,255,.8)}
.tabs button:hover{color:#fff}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--sinal)}
.tabs svg{display:none}
.right{margin-left:auto;display:flex;align-items:center;gap:.8rem}
.novo{background:var(--sinal);color:var(--sinal-ink);border:0;border-radius:6px;padding:.5rem .95rem;font-weight:700}
.novo:hover{filter:brightness(1.06)}
body[data-tela="lancar"] .novo{display:none}
.monthnav{display:flex;align-items:center;border:1px solid rgba(255,255,255,.35);border-radius:6px}
.monthnav button{background:none;border:0;color:#fff;min-width:2.2rem;height:2.2rem;font-weight:700;font-size:1.05rem}
.monthnav button:hover{background:rgba(255,255,255,.14)}
.monthnav .ml{white-space:nowrap;min-width:8.4rem;font-family:var(--cond);font-size:1.1rem;font-weight:600;padding:0 .3rem}
main{padding:1.2rem 1.5rem 2rem;max-width:1320px;margin:0 auto}

/* abertura: o dia e a régua do mês */
.hero{background:var(--band);color:#fff;margin:-1.2rem calc(50% - 50vw) 1.4rem;padding:1.3rem calc(50vw - 50%) 0}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8rem 2.5rem;align-items:end}
.saud{margin:0;color:rgba(255,255,255,.8);font-weight:500}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.5rem);font-weight:700;line-height:1;letter-spacing:-.005em}
.hnums{display:flex;gap:2.2rem}
.hnums small{display:block;color:rgba(255,255,255,.8);font-size:.9rem}
.hnums b{font-size:1.75rem;font-weight:600;line-height:1.1}
.hnote{grid-column:1/-1;margin:0;color:rgba(255,255,255,.8);font-size:.9rem;max-width:62ch}
.regua{grid-column:1/-1;display:grid;height:118px;align-items:end;margin-top:.4rem}
.regua button{display:grid;grid-template-rows:1fr 11px 20px;height:100%;border:0;background:none;padding:0;min-width:0;color:#fff;justify-items:center}
.regua .col{align-self:end;width:calc(100% - 4px);max-width:26px;border-radius:2px 2px 0 0;background:rgba(255,255,255,.55);transform-origin:bottom}
.regua.anim .col{animation:sobe .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 14ms)}
@keyframes sobe{from{transform:scaleY(0)}}
.regua em{width:100%;border-top:1px solid rgba(255,255,255,.7);position:relative;display:block}
.regua em::after{content:"";position:absolute;left:50%;top:0;width:1px;height:5px;background:rgba(255,255,255,.6)}
.regua .m5 em::after{height:10px;background:#fff}
.regua span{font-family:var(--cond);font-size:.85rem;font-weight:600;line-height:20px;color:rgba(255,255,255,.85);white-space:nowrap}
.regua button:hover .col{background:#fff}
.regua .hoje .col{background:var(--sinal)}
.regua .hoje span{color:var(--sinal);font-weight:700}
.regua .on .col{background:#fff;outline:2px solid var(--sinal);outline-offset:1px}
.regua .on span{color:#fff;font-weight:700}

/* grade, folhas e blocos de margem */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1.4rem 2rem;align-items:start}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.2rem 1.3rem}
.panel{margin-bottom:1rem}
.card > header,.panel > header,.bloco > header{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.8rem}
.card > h2,.panel > h2,.bloco > h2{margin-bottom:.8rem}
.margem{display:grid;gap:1.6rem;align-content:start}
.bloco{border-top:2px solid var(--ink);padding-top:.75rem}
.sec{grid-column:1/-1;border-top:2px solid var(--ink);padding-top:.75rem;margin-top:.4rem;display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
.sec p{margin:0;color:var(--muted)}
.nums{margin:0}
.nums div{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.42rem 0;border-bottom:1px solid var(--line)}
.nums div:last-child{border-bottom:0}
.nums dt{color:var(--muted)}
.nums dt small{display:block;font-size:.8rem}
.nums dd{margin:0;font-family:var(--cond);font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--accent-text);font-weight:600;padding:.3rem .4rem;border-radius:4px;text-decoration:underline;text-underline-offset:3px}
.addbtn{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.25rem;line-height:1;display:grid;place-items:center}
.addbtn:hover{background:var(--sinal);border-color:var(--sinal);color:var(--sinal-ink)}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sinal);border-radius:6px;padding:.75rem 1rem;margin-bottom:1.2rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.notice p{margin:0;flex:1;min-width:14rem}
.empty{color:var(--muted);padding:.8rem 0;margin:0}

/* diário */
.tools{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.4rem}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg label,.seg button{flex:1;text-align:center;position:relative;min-width:0}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span,.seg button{display:block;padding:.48rem .8rem;font-weight:600;color:var(--muted);font-size:.95rem;border:0;background:none;white-space:nowrap}
.seg label + label span,.seg button + button{border-left:1px solid var(--line)}
.seg input:checked + span,.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg input:focus-visible + span{outline:2px solid var(--sinal);outline-offset:-2px}
.busca{flex:1;min-width:9rem;position:relative}
.busca input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.48rem .7rem .48rem 2.1rem;min-height:2.4rem}
.busca input:focus{border-color:var(--ink);outline:none}
.busca svg{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.filtros{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 0}
.filtro{background:var(--sinal);color:var(--sinal-ink);border:0;border-radius:4px;padding:.25rem .6rem;font-weight:600;font-size:.9rem}
.scrolly{max-height:27rem;overflow:auto}
.scrolly.alto{max-height:46rem}
.dgrupo{display:grid;grid-template-columns:4.2rem minmax(0,1fr);border-top:1px solid var(--ink)}
.dgrupo:first-child{border-top:0}
.dmarg{padding:.7rem 0 .5rem;line-height:1}
.dmarg b{display:block;font-family:var(--cond);font-size:2.1rem;font-weight:700;letter-spacing:-.01em}
.dmarg span{display:block;margin-top:.2rem;color:var(--muted);font-size:.9rem}
.dgrupo.hoje .dmarg span{display:inline-block;background:var(--sinal);color:var(--sinal-ink);font-weight:600;padding:.1rem .35rem;border-radius:3px}
.dlin{min-width:0}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8rem;align-items:baseline;padding:.5rem .4rem;cursor:pointer;border-bottom:1px solid var(--line)}
.lrow:hover{background:var(--soft)}
.scrolly > .lrow:last-child{border-bottom:0}
.nm{min-width:0}
.nm b{font-weight:600;margin-right:.5rem}
.chip{display:inline-block;font-style:normal;font-size:.84rem;color:var(--muted);margin-right:.5rem;white-space:nowrap}
.chip.g{color:var(--in)}
.chip.w{color:var(--sinal-ink);background:var(--sinal);border-radius:3px;padding:0 .3rem}
.chip.BB,.chip.Nubank{border-radius:3px;padding:0 .35rem;font-weight:600}
.chip.BB{background:#FBE122;color:#0B3FA0}
.chip.Nubank{background:#8A05BE;color:#fff}
.val{font-size:1.2rem;font-weight:600}
.dtot{display:flex;justify-content:flex-end;gap:1rem;padding:.4rem .4rem .7rem;color:var(--muted);font-size:.92rem}
.dtot .num{font-weight:600;font-size:1rem}
.lfoot{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem 1.2rem;flex-wrap:wrap;margin-top:.2rem;padding-top:.7rem;border-top:2px solid var(--ink)}
.lfoot .num{font-weight:600;font-size:1.15rem}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--in);display:inline-block}
.dot.s{background:var(--out)}
.prow{display:grid;grid-template-columns:.55rem minmax(0,1fr) auto;gap:.6rem;align-items:baseline;padding:.42rem .2rem;border-bottom:1px solid var(--line);cursor:pointer}
.prow:hover,.arow:hover{background:var(--soft)}
.arow{display:grid;grid-template-columns:1.3rem minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.42rem .2rem;border-bottom:1px solid var(--line)}
.arow .nm{cursor:pointer}
.arow.pago .nm,.arow.pago .val{color:var(--muted);text-decoration:line-through}
.bloco .val{font-size:1.1rem}
.bloco .lfoot{border-top:0;padding-top:.5rem}
input[type=checkbox]{width:1.15rem;height:1.15rem;accent-color:var(--accent)}

/* rosca */
.donut{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:1.1rem;align-items:center}
.donut svg{width:100%;height:auto;display:block;overflow:visible}
.donut path{stroke:var(--bg);stroke-width:1.5;transition:opacity .15s}
.card .donut path{stroke:var(--surface)}
.donut path[data-cat]{cursor:pointer}
.donut svg:hover path{opacity:.35}
.donut svg path:hover{opacity:1}
.donut path.dim{opacity:.2}
.donut text.pl{display:none}
.donut text.dc1{fill:var(--muted);font-size:10.5px;font-weight:500;font-family:inherit}
.donut text.dc2{fill:var(--ink);font-size:15px;font-weight:600;font-family:var(--cond)}
.leg{list-style:none;margin:0;padding:0;font-size:.95rem;max-height:13rem;overflow:auto}
.leg li{display:grid;grid-template-columns:.7rem minmax(0,1fr) auto;gap:.5rem;align-items:baseline;padding:.2rem .2rem;border-bottom:1px solid var(--line)}
.leg li[data-cat]{cursor:pointer}
.leg li[data-cat]:hover{background:var(--surface)}
.leg li.on{background:var(--sinal);color:var(--sinal-ink)}
.leg li.on .muted{color:inherit}
.leg i{width:.7rem;height:.7rem;display:block;align-self:center}
.leg span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .num{font-weight:600;font-size:1.02rem}
.leg .pc{display:none}

/* cartões */
.cc{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem}
.badge{width:38px;height:38px;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;background:var(--soft)}
.badge.BB{background:#FBE122;color:#0B3FA0}
.badge.Nubank{background:#8A05BE;color:#fff}
.cc .t{flex:1;min-width:0}
.cc .t small{display:block;color:var(--muted)}
.cc .t b{font-family:var(--cond);font-size:1.7rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}

/* formulários */
.entry{max-width:30rem;margin:0 auto}
.entry.card{padding:1.4rem}
.valor{display:flex;align-items:baseline;gap:.5rem;border-bottom:2px solid var(--ink);margin:.4rem 0 1.1rem}
.valor:focus-within{border-bottom-color:var(--accent)}
.valor span{font-family:var(--cond);font-size:1.5rem;font-weight:600;color:var(--muted)}
.valor input{flex:1;min-width:0;border:0;background:none;font-family:var(--cond);font-size:4rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;padding:0;outline:none;box-shadow:none}
.valor input::placeholder{color:var(--line)}
.field{margin-bottom:.9rem}
.field > label,.field > .lab{display:block;font-size:.92rem;color:var(--muted);margin-bottom:.3rem}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.55rem .7rem;min-height:2.8rem}
.field input:focus,.field select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--sinal)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.inline{display:flex;gap:.5rem;align-items:center}
.inline input{flex:1}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.5rem .9rem;font-weight:600;min-height:2.5rem}
.ghost:hover{border-color:var(--ink)}
.primary{background:var(--sinal);color:var(--sinal-ink);border:0;border-radius:6px;padding:.85rem 1rem;font-weight:700;width:100%;font-size:1.1rem}
.primary:hover{filter:brightness(1.05)}
.primary:disabled{opacity:.5;cursor:default}
.danger{background:none;border:1px solid var(--out);color:var(--out);border-radius:6px;padding:.5rem .9rem;font-weight:600}
.favs{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 .5rem}
.favs button{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.3rem .65rem;font-size:.95rem}
.favs button:hover{border-color:var(--ink)}
.favs button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;grid-auto-rows:1fr}
.chips label{position:relative;text-align:center}
.chips input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chips span{display:flex;align-items:center;justify-content:center;height:100%;line-height:1.2;padding:.7rem .3rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:600}
.chips label:hover span{border-color:var(--ink)}
.chips input:checked + span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips input:focus-visible + span{outline:2px solid var(--sinal);outline-offset:2px}
.err{color:var(--out);font-weight:600;min-height:1.3rem;margin:.3rem 0}
.hint{margin:.3rem 0 0;font-size:.9rem;color:var(--muted)}
.recent{list-style:none;margin:0;padding:0}
.recent li{display:flex;gap:.6rem;align-items:baseline;padding:.5rem 0;border-top:1px solid var(--line)}
.recent li:first-child{border-top:0}
.recent li span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ano */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.9rem;color:var(--muted);font-weight:500;padding:.35rem .5rem;border-bottom:2px solid var(--ink)}
td{padding:.45rem .5rem;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
td.num{font-size:1.1rem;font-weight:600}
tbody tr[data-goto]:hover td{background:var(--soft)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.bars g[data-goto]{cursor:pointer}
.bars rect.hit{fill:transparent}
.bars g[data-goto]:hover rect.hit{fill:var(--soft)}
svg text{fill:var(--muted);font-size:12px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:500}
.legenda{display:flex;gap:1rem;color:var(--muted)}
.kpi small{display:block;color:var(--muted)}
.kpi b{font-family:var(--cond);font-size:1.6rem;font-weight:600}

dialog{border:1px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);padding:1.4rem;width:min(30rem,calc(100vw - 1.5rem));max-height:calc(100vh - 2rem)}
dialog::backdrop{background:rgba(8,20,13,.55)}
dialog h2{margin-bottom:.4rem}
.dlgbtns{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}
.dlgbtns .primary{flex:1;width:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(4rem + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:6px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 2rem);z-index:20}
#toast.on{opacity:1}

@media (max-width:1100px){
  .c8,.c7,.c5,.c4.wide{grid-column:span 12}
  .c4{grid-column:span 6}
  .margem{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6rem 2rem}
}
@media (max-width:759px){
  .top{padding:0 1rem;min-height:3.1rem;gap:.6rem}
  .brand{font-size:1.3rem}
  .novo{display:none}
  .monthnav .ml{min-width:0;padding:0 .2rem;font-size:1rem}
  .monthnav button{min-width:1.9rem;height:2rem}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);align-items:center;justify-content:space-around;padding:.3rem .5rem calc(.3rem + env(safe-area-inset-bottom,0px))}
  .tabs svg{display:block;width:22px;height:22px}
  .tabs button{flex:1;flex-direction:column;gap:.05rem;font-size:.85rem;color:var(--muted);border:0;padding:.3rem .2rem}
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-selected="true"]{color:var(--accent-text)}
  .tabs button.plus{flex:0 0 5rem}
  .tabs button.plus svg{width:54px;height:54px;padding:14px;border-radius:8px;background:var(--sinal);color:var(--sinal-ink);margin-top:-1.5rem;border:3px solid var(--surface)}
  .tabs button.plus span{display:none}
  main{padding:1rem 1rem 6rem}
  .hero{margin-top:-1rem;padding-top:1rem}
  .hero-in{grid-template-columns:minmax(0,1fr)}
  .hnums{gap:1.3rem;flex-wrap:wrap}
  .hnums b{font-size:1.45rem}
  .regua{height:96px}
  .regua span{font-size:.72rem}
  .grid{gap:1.3rem}
  .c4,.c6{grid-column:span 12}
  .margem{grid-template-columns:minmax(0,1fr)}

<script>
/* Versão independente: os dados ficam neste navegador (localStorage). Com senha, ficam cifrados (AES-GCM, chave derivada da senha por PBKDF2). */
(function(){
  var PRE='fin:',META='finsec:meta',ITER=250000,MINUTOS=10,chave=null,LS=window.localStorage,te=new TextEncoder(),td=new TextDecoder();
  function b64(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
  function ub64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}

  function ids(){var o=[];try{for(var i=0;i<LS.length;i++){var k=LS.key(i);if(k&&k.indexOf(PRE)===0)o.push(k.slice(PRE.length))}}catch(e){}return o.sort()}
  function deriva(senha,salt,iter){return crypto.subtle.importKey('raw',te.encode(senha),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])})}

  function decifra(k,str){var o=JSON.parse(str);if(!o||o.enc!==1)return Promise.resolve(o);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},k,ub64(o.ct)).then(function(pt){return JSON.parse(td.decode(pt))})}
  function ler(id,k){var v=LS.getItem(PRE+id);if(!v)return Promise.resolve(null);k=k===undefined?chave:k;return k?decifra(k,v):Promise.resolve(JSON.parse(v))}
  function gravar(id,d,k){k=k===undefined?chave:k;return (k?cifra(k,d):Promise.resolve(JSON.stringify(d))).then(function(s){LS.setItem(PRE+id,s)})}
  function todos(k){var l=ids();return Promise.all(l.map(function(id){return ler(id,k)})).then(function(v){var o={};l.forEach(function(id,i){o[id]=v[i]});return o})}
  var db={collection:function(){return {
    get:function(){return todos().then(function(o){return {docs:Object.keys(o).map(function(id){return {id:id,exists:true,data:function(){return o[id]}}})}})},
    doc:function(id){return {
      get:function(){return ler(id).then(function(v){return {id:id,exists:!!v,data:function(){return v}}})},
      set:function(d){return gravar(id,d)}}}}}};
  var liberar,liberado=new Promise(function(r){liberar=r});
  window.claude={use:function(n){
    if(n==='user')return Promise.resolve({id:function(){return Promise.resolve('local')}});
    if(n==='db')return liberado.then(function(){return db});
    return Promise.resolve(null)}};

  /* painel de senha */
  function painel(o){
    var d=document.createElement('div');d.className='trava';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','tv-t');
    var h='<div class="tv-cx"><h2 id="tv-t">'+o.titulo+'</h2>'+(o.texto?'<p class="hint" style="margin:0 0 1rem">'+o.texto+'</p>':'');
    o.campos.forEach(function(c,i){h+='<div class="field"><label for="tv-'+i+'">'+c+'</label><input type="password" id="tv-'+i+'" autocomplete="new-password" autocapitalize="off" spellcheck="false"></div>'});
    h+='<div class="err" id="tv-err" role="alert"></div><div class="dlgbtns"><button class="primary" id="tv-ok">'+o.botao+'</button>'+(o.cancelar?'<button class="ghost" id="tv-no">Cancelar</button>':'')+'</div></div>';
    d.innerHTML=h;document.body.appendChild(d);
    var ins=d.querySelectorAll('input'),err=d.querySelector('#tv-err'),ok=d.querySelector('#tv-ok'),ocupado=false;
    var fechar=function(){d.remove()},erro=function(t){ocupado=false;ok.disabled=false;err.textContent=t;ins[0].focus();ins[0].select()};
    var vai=function(){if(ocupado)return;ocupado=true;ok.disabled=true;err.textContent='';o.ok([].map.call(ins,function(x){return x.value}),erro,fechar)};
    ok.addEventListener('click',vai);d.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();vai()}if(e.key==='Escape'&&o.cancelar)fechar()});
    if(o.cancelar)d.querySelector('#tv-no').addEventListener('click',fechar);
    ins[0].focus();
  }
  function confere(senha){var m=meta();return deriva(senha,ub64(m.salt),m.iter).then(function(k){return decifra(k,m.check).then(function(){return k})})}
  function novaChave(senha){var salt=crypto.getRandomValues(new Uint8Array(16));return deriva(senha,salt,ITER).then(function(k){return cifra(k,{ok:1}).then(function(ck){return {k:k,meta:{v:1,salt:b64(salt),iter:ITER,check:ck}}})})}

  function valida(a,b){if(a.length<4)return 'A senha precisa ter pelo menos 4 caracteres.';if(a!==b)return 'As duas senhas não são iguais.';return ''}
  function destravar(){
    painel({titulo:'Financeiro',texto:'Digite a senha para abrir.',campos:['Senha'],botao:'Entrar',ok:function(v,erro,fechar){
      confere(v[0]).then(function(k){chave=k;fechar();rodape();vigia();liberar()}).catch(function(){erro('Senha incorreta.')})}});
  }
  function criarSenha(){
    painel({titulo:'Criar senha',texto:'A senha vale só para este navegador. Se você esquecer, não há como recuperar os dados: guarde um backup em lugar seguro.',campos:['Nova senha','Repita a senha'],botao:'Criar senha',cancelar:true,ok:function(v,erro,fechar){
      var e=valida(v[0],v[1]);if(e)return erro(e);
      todos(null).then(function(dados){return novaChave(v[0]).then(function(n){return regrava(dados,n.k).then(function(){LS.setItem(META,JSON.stringify(n.meta));chave=n.k})})})
        .then(function(){fechar();rodape('Senha criada. Ela será pedida sempre que o site for aberto.');vigia()}).catch(function(){erro('Não foi possível criar a senha.')})}});
  }
  function alterarSenha(){
    painel({titulo:'Alterar senha',campos:['Senha atual','Nova senha','Repita a nova senha'],botao:'Alterar senha',cancelar:true,ok:function(v,erro,fechar){
      var e=valida(v[1],v[2]);if(e)return erro(e);
      confere(v[0]).then(function(kOld){return todos(kOld).then(function(dados){return novaChave(v[1]).then(function(n){return regrava(dados,n.k).then(function(){LS.setItem(META,JSON.stringify(n.meta));chave=n.k})})})},function(){throw 'senha'})
        .then(function(){fechar();rodape('Senha alterada.')}).catch(function(x){erro(x==='senha'?'Senha atual incorreta.':'Não foi possível alterar a senha.')})}});
  }
  function removerSenha(){
    painel({titulo:'Remover senha',texto:'Sem senha, qualquer pessoa que abrir o site neste navegador vê os lançamentos.',campos:['Senha atual'],botao:'Remover senha',cancelar:true,ok:function(v,erro,fechar){
      confere(v[0]).then(function(k){return todos(k).then(function(dados){return regrava(dados,null).then(function(){LS.removeItem(META);chave=null})})},function(){throw 'senha'})
        .then(function(){fechar();rodape('Senha removida.')}).catch(function(x){erro(x==='senha'?'Senha incorreta.':'Não foi possível remover a senha.')})}});
  }
  var tempo=null;
  function vigia(){if(!meta())return;var arma=function(){clearTimeout(tempo);tempo=setTimeout(function(){if(meta())window.location.reload()},MINUTOS*60000)};
    if(!vigia.on){vigia.on=true;['pointerdown','keydown','scroll'].forEach(function(ev){window.addEventListener(ev,arma,{passive:true})})}arma()}

  /* rodapé: backup e senha */
  function rodape(aviso){
    var f=document.querySelector('footer.bk');if(!f){f=document.createElement('footer');f.className='bk';document.body.insertBefore(f,document.getElementById('dlg'))}
    var tem=!!meta();
    f.innerHTML='<p id="bk-msg">'+(aviso||(tem?'Protegido por senha. Os dados ficam guardados só neste navegador e o site trava após '+MINUTOS+' minutos sem uso.':'Os dados ficam guardados só neste navegador. Exporte um backup de vez em quando.'))+'</p><div>'+
      '<button class="ghost" data-bk="exp">Exportar backup</button><button class="ghost" data-bk="imp">Importar backup</button>'+
      (tem?'<button class="ghost" data-bk="trava">Bloquear agora</button><button class="ghost" data-bk="muda">Alterar senha</button><button class="ghost" data-bk="tira">Remover senha</button>':'<button class="ghost" data-bk="cria">Criar senha</button>')+
      '<input type="file" id="bk-file" accept="application/json,.json" hidden></div>';
    f.querySelector('#bk-file').addEventListener('change',function(e){var a=e.target.files[0];if(a)importar(a)});
  }
  function msg(t){var m=document.getElementById('bk-msg');if(m){m.textContent=t;m.style.color='var(--out)'}}
  function exportar(){todos().then(function(o){var a=document.createElement('a'),d=new Date();a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));
    a.download='financeiro-backup-'+d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+'.json';document.body.appendChild(a);a.click();a.remove()}).catch(function(){msg('Não foi possível exportar.')})}
  function importar(file){var r=new FileReader();
    r.onload=function(){var o,validos={};try{o=JSON.parse(r.result)}catch(e){o=null}
      if(o)Object.keys(o).forEach(function(id){if((id==='config'||/^m-\d{4}-\d{2}$/.test(id))&&o[id]&&typeof o[id]==='object'&&o[id].enc!==1)validos[id]=o[id]});
      if(!Object.keys(validos).length){msg('Este arquivo não é um backup do Financeiro. Nada foi alterado.');return}
      regrava(validos).then(function(){window.location.reload()}).catch(function(){msg('Não foi possível importar.')})};
    r.onerror=function(){msg('Não foi possível ler o arquivo.')};r.readAsText(file)}
  document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-bk]');if(!t)return;var a=t.dataset.bk;
    if(a==='exp')exportar();else if(a==='imp')document.getElementById('bk-file').click();else if(a==='cria')criarSenha();else if(a==='muda')alterarSenha();else if(a==='tira')removerSenha();else if(a==='trava')window.location.reload()});

    if(meta()){if(!(window.crypto&&crypto.subtle)){document.body.insertAdjacentHTML('beforeend','<div class="trava"><div class="tv-cx"><h2>Financeiro</h2><p>Este navegador não permite abrir os dados protegidos por senha. Abra o site pelo endereço https.</p></div></div>');return}destravar()}
    else{rodape();liberar()}
  });
})();

<script>
(function(){

var HOJE_YM=now.getFullYear()+'-'+pad(now.getMonth()+1);
var S={ym:HOJE_YM,tab:(window.innerWidth<760?'lancar':'resumo'),docs:{},
  cfg:{cats:['Mercado','Contas','Casa','Saúde','Lazer'],tipos:['Salário','Reembolso','Extra','Saldo anterior'],bancos:['BB','Nubank','Dinheiro'],cartoes:['BB','Nubank']},
  ready:false,err:null,kind:'desp',recent:[],hist:{desp:{},rec:{},card:{},prev:{},receber:{}},busy:false};

function brl(v){return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function norm(d){['rec','desp','card','prev','receber'].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[]});if(typeof d.notas!=='string')d.notas='';return d}
function doc(ym){return S.docs[ym]||norm({ym:ym})}
function ymLabel(ym){var p=ym.split('-');return MES[+p[1]-1]+' '+p[0]}
function ymAdd(ym,n){var p=ym.split('-').map(Number);var t=p[0]*12+(p[1]-1)+n;return Math.floor(t/12)+'-'+pad(t%12+1)}

/* ---------- dados ---------- */
function buildHist(){
  var h={desp:{},rec:{},card:{},prev:{},receber:{}};
  Object.keys(S.docs).sort().forEach(function(ym){var d=S.docs[ym];
    ['desp','rec','card'].forEach(function(k){d[k].forEach(function(it){
      var key=(it.d||'').trim().toLowerCase();if(!key||/^n[ãa]o sei/.test(key))return;
      var e=h[k][key]||(h[k][key]={d:it.d.trim(),n:0});e.n++;e.v=it.v;
      if(it.c)e.c=it.c;if(it.b)e.b=it.b;if(it.t)e.t=it.t;
    })});
  });
  S.hist=h;
}
function favs(kind){var h=S.hist[kind]||{};return Object.keys(h).map(function(k){return h[k]}).filter(function(e){return e.n>=3}).sort(function(a,b){return b.n-a.n}).slice(0,8)}
function mutate(ym,fn){
  var run=function(){var ref=col.doc('m-'+ym);
    return ref.get().then(function(snap){
      var d=norm(snap.exists?clone(snap.data()):{ym:ym});var r=fn(d);
      return ref.set(d).then(function(){S.docs[ym]=d;buildHist();return r});
    });
  };
  var p=chain.then(run);chain=p.catch(function(){});return p;
}
function saveCfg(){var p=chain.then(function(){return col.doc('config').set(clone(S.cfg))});chain=p.catch(function(){});return p}
function cardFor(ym){var out=[];Object.keys(S.docs).forEach(function(k){var diff=ymDiff(k,ym);if(diff<0)return;
  S.docs[k].card.forEach(function(it){if(diff===0)out.push({it:it,o:k,p:it.p||1});else if(it.rep){if(!it.fim||ym<=it.fim)out.push({it:it,o:k,p:1})}else if(it.proj&&(it.p||1)+diff<=(it.n||1))out.push({it:it,o:k,p:(it.p||1)+diff})})});
  return out}
function totais(ym){var d=doc(ym);var r=sum(d.rec,function(x){return x.v}),g=sum(d.desp,function(x){return x.v});
  var fe=0,fs=0,pe=0,ps=0;d.prev.forEach(function(x){if(x.t==='E'){if(x.c)fe+=x.v;else pe+=x.v}else{if(x.c)fs+=x.v;else ps+=x.v}});
  var atual=r-g,fut=atual+fe-fs;return {rec:r,desp:g,atual:atual,futuro:fut,possivel:fut+pe-ps,fe:fe,fs:fs,pe:pe,ps:ps}}

function readForm(ctx,kind){
  var g=function(id){var e=document.getElementById(ctx+'-'+id);return e?e.value:''};
  var rad=function(n){var e=document.querySelector('input[name="'+ctx+'-'+n+'"]:checked');return e?e.value:''};
  var v=parseValor(g('v'));if(isNaN(v)||v===0)return 'Informe o valor.';
  var it={d:g('d').trim(),v:Math.round(v*100)/100};
  if(!it.d)return 'Informe a descrição.';
  var novo=null;
  if(kind==='desp'||kind==='rec'){var c=g('c');if(c==='__new'){c=g('cnew').trim();if(!c)return 'Escreva o nome da nova opção.';novo=c}
    if(kind==='desp'){it.c=c;it.b=rad('b')}else{it.t=c}}
  if(kind==='card'){it.b=rad('b');it.n=Math.max(1,parseInt(g('n'),10)||1);it.p=Math.min(it.n,Math.max(1,parseInt(g('p'),10)||1));it.s=it.n>1?'pa':'av';it.proj=it.n>1;var cx=document.getElementById(ctx+'-x');if(cx&&cx.checked)it.x=true;
    var cr=document.getElementById(ctx+'-rep');if(cr&&cr.checked){it.rep=true;it.n=1;it.p=1;it.s='av';it.proj=false;var fm=g('fim');if(fm)it.fim=fm}}
  if(kind==='prev'){it.t=rad('t')||'S';it.c=rad('pc')!=='0'}
  if(kind==='receber'){it.pago=rad('pg')==='1'}
  if(kind==='card'&&rad('ana')==='1')it.ana=rad('anav')==='total'?'total':'metade';
  var dt=g('dt');if(dt)it.dt=dt;
  var ob=g('obs').trim();if(ob)it.obs=ob;
  return {it:it,novo:novo,ym:kind==='card'?g('m1'):''};
}

function arc(a0,a1,R,r){var l=(a1-a0)>Math.PI?1:0,c=Math.cos,s=Math.sin,f=function(n){return n.toFixed(2)};
  return 'M'+f(c(a0)*R)+' '+f(s(a0)*R)+'A'+R+' '+R+' 0 '+l+' 1 '+f(c(a1)*R)+' '+f(s(a1)*R)+'L'+f(c(a1)*r)+' '+f(s(a1)*r)+'A'+r+' '+r+' 0 '+l+' 0 '+f(c(a0)*r)+' '+f(s(a0)*r)+'Z'}
function donut(cl,rotulo,sel,clic,grande){
  var tot=sum(cl,function(x){return x[1]}),a=-Math.PI/2,R=96,r=58,g='',lb='';
  cl.forEach(function(x,i){var f=x[1]/tot,b=a+f*2*Math.PI,a1=f>=0.9999?a+2*Math.PI-0.001:b,pc=(f*100).toFixed(f<0.1?1:0).replace('.',',')+'%';
    g+='<path d="'+arc(a,a1,R,r)+'" data-slice data-n="'+esc(x[0])+'" data-v="'+esc(brl(x[1]))+'" data-p="'+pc+'"'+(clic?' data-cat="'+esc(x[0])+'"':'')+(sel&&sel!==x[0]?' class="dim"':'')+' style="fill:'+CORES[i%CORES.length]+'"></path>';
    if(f>=0.07){var m=(a+b)/2,rr=(R+r)/2;lb+='<text class="pl" x="'+(Math.cos(m)*rr).toFixed(1)+'" y="'+(Math.sin(m)*rr).toFixed(1)+'" text-anchor="middle" dominant-baseline="central">'+Math.round(f*100)+'%</text>'}
    a=b});
  var svg='<svg viewBox="-102 -102 204 204" role="img" aria-label="'+esc(rotulo)+'" data-t="'+esc(brl(tot))+'">'+g+lb+'<text class="dc1" y="-7" text-anchor="middle">Total</text><text class="dc2" y="11" text-anchor="middle"'+(brl(tot).length>12?' style="font-size:14px"':'')+'>'+brl(tot)+'</text></svg>';
  var leg='<ul class="leg">'+cl.map(function(x,i){return '<li'+(clic?' data-cat="'+esc(x[0])+'" tabindex="0"':'')+(sel===x[0]?' class="on"':'')+'><i style="background:'+CORES[i%CORES.length]+'"></i><span>'+esc(x[0])+'</span><span class="num">'+brl(x[1])+'</span><span class="num muted pc">'+(x[1]/tot*100).toFixed(0)+'%</span></li>'}).join('')+'</ul>';
  return '<div class="donut'+(grande?' grande':'')+'">'+svg+leg+'</div>';
}

    it.b=pg.slice(5);it.p=1;it.n=qn;it.s=qn>1?'pa':'av';it.proj=qn>1;if(qr)it.rep=true;
    var qa=document.querySelector('input[name="q-ana"]:checked'),qv=document.querySelector('input[name="q-anav"]:checked');if(qa&&qa.value==='1')it.ana=(qv&&qv.value==='total')?'total':'metade'}else{it.c=c;it.b=pg}

    h+='<div class="lfoot"><span>A entrar <span class="num in">'+brl(t.fe)+'</span></span><span>A sair <span class="num out">'+brl(t.fs)+'</span></span>'+((t.pe||t.ps)?'<span class="muted">Possíveis <span class="num">+'+brl(t.pe)+' / −'+brl(t.ps)+'</span></span>':'')+'</div>'}
  else h+='<p class="empty">Nenhuma previsão em '+esc(ymLabel(ym))+'. Sem previsões, o saldo futuro fica igual ao atual.</p>';
  h+='</section>';
  // últimos lançamentos
  var its=itensMes(ym),ordK={desp:0,rec:1,card:2};
  its.sort(function(a,b){if(a.dt!==b.dt)return a.dt===''?1:b.dt===''?-1:(a.dt<b.dt?1:-1);return ordK[a.k]-ordK[b.k]||b.i-a.i});
  h+='<section class="card c5"><header><h2>Últimos lançamentos</h2><button class="linkbtn" data-tab="mes">Ver o mês completo</button></header>';
  if(cur)h+='<div class="diario"><div><small>Gasto hoje</small><b>'+brl(saidasDia(hj))+'</b></div><div><small>Despesa mensal</small><b>'+brl(t.desp)+'</b></div></div>';
  h+=its.length?its.slice(0,6).map(function(o){return linha(o,true)}).join(''):'<p class="empty">Nenhum lançamento em '+esc(ymLabel(ym))+' ainda.</p>';
  h+='</section></div>';
  view.innerHTML=h;
}
function renderAno(){
  var y=S.ym.split('-')[0],rows=[],mx=1,m;
  for(m=1;m<=12;m++){var t=totais(y+'-'+pad(m));rows.push(t);mx=Math.max(mx,t.rec,t.desp)}
  var te=sum(rows,function(r){return r.rec}),ts=sum(rows,function(r){return r.desp}),nm=rows.filter(function(r){return r.rec||r.desp}).length||1;
  var top=Math.ceil(mx*1.08/4000)*4000,W=1160,H=250,L=54,gx=(W-L)/12,bw=38,mil=function(v){return 'R$ '+(v/1000).toFixed(1).replace('.',',')+'k'};
  var h='<div class="grid">';
  h+='<section class="card c4">'+kpi('Entradas em '+y,te,'in')+'</section><section class="card c4">'+kpi('Saídas em '+y,ts,'out')+'</section><section class="card c4 wide">'+kpi('Média de saídas por mês',ts/nm,'')+'</section>';
  var svg='<svg class="bars" viewBox="0 -12 '+W+' '+(H+38)+'" role="img" aria-label="Entradas e saídas por mês em '+y+'" style="width:100%;height:auto;min-width:900px">';
  for(var k=0;k<=4;k++){var yy=H-H*k/4;svg+='<line x1="'+L+'" y1="'+yy+'" x2="'+W+'" y2="'+yy+'" style="stroke:var(--line)"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">R$ '+(top*k/4/1000).toLocaleString('pt-BR')+'k</text>'}
  rows.forEach(function(r,i){var x=L+i*gx+gx/2,he=r.rec/top*H,hs=r.desp/top*H;
    svg+='<g data-goto="'+y+'-'+pad(i+1)+'" tabindex="0"><title>'+MES[i]+': entradas '+brl(r.rec)+', saídas '+brl(r.desp)+'</title><rect class="hit" x="'+(x-gx/2+2)+'" y="0" width="'+(gx-4)+'" height="'+H+'" rx="2"/>'+
      '<rect class="b" x="'+(x-bw-4)+'" y="'+(H-he)+'" width="'+bw+'" height="'+he+'" rx="1" style="fill:var(--in)"/><rect class="b" x="'+(x+4)+'" y="'+(H-hs)+'" width="'+bw+'" height="'+hs+'" rx="1" style="fill:var(--out)"/>'+
      (r.rec?'<text class="vl e" x="'+(x-23)+'" y="'+(H-he-5)+'" text-anchor="middle">'+mil(r.rec)+'</text>':'')+(r.desp?'<text class="vl s" x="'+(x+23)+'" y="'+(H-hs-5)+'" text-anchor="middle">'+mil(r.desp)+'</text>':'')+
      '<text x="'+x+'" y="'+(H+18)+'" text-anchor="middle">'+MES[i].slice(0,3)+'</text></g>'});
  svg+='</svg>';
  h+='<section class="card c12"><header><h2>Panorama anual de '+y+'</h2><div class="legenda"><span><span class="dot"></span> Entradas</span><span><span class="dot s"></span> Saídas</span></div></header><div class="scroll">'+svg+'</div></section>';
  h+='<section class="card c7"><h2>Mês a mês</h2><div class="scroll"><table><thead><tr><th>Mês</th><th class="r">Saídas</th><th class="r">Entradas</th><th class="r">Diferença</th></tr></thead><tbody>'+rows.map(function(r,i){
    return '<tr data-goto="'+y+'-'+pad(i+1)+'" tabindex="0" style="cursor:pointer"><td><b>'+MES[i]+'</b></td><td class="r num out">'+brl(r.desp)+'</td><td class="r num in">'+brl(r.rec)+'</td><td class="r num">'+brl(r.atual)+'</td></tr>'}).join('')+
    '</tbody><tfoot><tr><td>Total</td><td class="r num">'+brl(ts)+'</td><td class="r num">'+brl(te)+'</td><td class="r num">—</td></tr></tfoot></table></div></section>';
  var cat={};for(m=1;m<=12;m++)doc(y+'-'+pad(m)).desp.forEach(function(x){var c=x.c||'Sem categoria';cat[c]=(cat[c]||0)+x.v});
  var cl=Object.keys(cat).map(function(c){return [c,cat[c]]}).filter(function(x){return x[1]>0}).sort(function(a,b){return b[1]-a[1]});
  h+='<section class="card c5"><h2>Despesas por categoria no ano</h2>'+(cl.length?donut(cl,'Despesas por categoria em '+y,null,false):'<p class="empty">Sem despesas em '+y+'.</p>')+'</section>';
  h+='</div>';view.innerHTML=h;
}

/* ---------- ações ---------- */
function lancar(){
  if(S.busy)return;var k=S.kind,r=readForm('n',k),err=$('#n-err');
  if(typeof r==='string'){err.textContent=r;return}
  var it=r.it;it.id=uid();var ym=r.ym||S.ym;S.busy=true;$('#n-go').disabled=true;err.textContent='';
  mutate(ym,function(d){d[KIND[k].lista].push(it)}).then(function(){
    registraNovo(k,r.novo);S.recent.unshift({kind:k,ym:ym,id:it.id,d:it.d,v:it.v});S.busy=false;
    toast('Lançado em '+ymLabel(ym)+': '+it.d+' '+brl(it.v));render();var v=$('#n-v');if(v)v.focus();
  }).catch(function(){S.busy=false;$('#n-go').disabled=false;err.textContent='Não foi possível salvar. Verifique a conexão e tente de novo.'});
}
function findItem(kind,ym,id){var l=doc(ym)[KIND[kind].lista];for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null}
function remover(kind,ym,id){return mutate(ym,function(d){var k=KIND[kind].lista;d[k]=d[k].filter(function(x){return x.id!==id})})}
function abrirDlg(kind,ym,id,def){
  var it=id?findItem(kind,ym,id):null;if(id&&!it)return;
  var h='<h2>'+(it?'Editar ':'Adicionar ')+esc(KIND[kind].nome.toLowerCase())+' em '+esc(ymLabel(ym))+'</h2>';
  if(it&&kind==='card'&&ym!==S.ym)h+='<p class="muted" style="margin-top:0">Compra lançada em '+esc(ymLabel(ym))+'. Alterar ou excluir vale para todos os meses em que ela aparece.</p>';
  h+=formHTML('e',kind,it||def||{},ym)+'<div class="err" id="e-err"></div><div class="dlgbtns">';
  h+='<button class="primary" id="e-ok">'+(it?'Salvar alterações':'Adicionar')+'</button><button class="ghost" id="e-cancel">Cancelar</button>';
  if(it)h+='<button class="danger" id="e-del">Apagar</button>';
  h+='</div>';dlg.innerHTML=h;dlg.dataset.k=kind;dlg.dataset.ym=ym;dlg.dataset.id=id||'';
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
}
function salvarDlg(){
  var kind=dlg.dataset.k,ym=dlg.dataset.ym,id=dlg.dataset.id,r=readForm('e',kind);
  if(typeof r==='string'){$('#e-err').textContent=r;return}
  $('#e-ok').disabled=true;
  var dest=r.ym||ym,pr;
  if(id&&dest!==ym){r.it.id=id;
    pr=mutate(ym,function(d){d.card=d.card.filter(function(x){return x.id!==id})}).then(function(){return mutate(dest,function(d){d.card.push(r.it)})})}
  else pr=mutate(dest,function(d){var l=d[KIND[kind].lista];
    if(id){for(var i=0;i<l.length;i++)if(l[i].id===id){r.it.id=id;if(kind==='card'&&!('proj' in l[i])&&!r.it.rep&&r.it.n===(l[i].n||1)){delete r.it.proj;r.it.s=l[i].s||r.it.s}l[i]=r.it}}
    else{r.it.id=uid();l.push(r.it)}
  });
  pr.then(function(){registraNovo(kind,r.novo);dlg.close();toast(id?'Alterações salvas':'Adicionado em '+ymLabel(dest));render()})
   .catch(function(){$('#e-ok').disabled=false;$('#e-err').textContent='Não foi possível salvar. Tente de novo.'});
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-del],[data-modo],#q-go,[data-ir],[data-tab],[data-nav],[data-fav],[data-undo],[data-edit],[data-add],[data-hoje],[data-saldo],[data-goto],#n-go,#salvaNotas,#e-ok,#e-cancel,#e-del');
  if(!t)return;
  if(t.dataset.ir){var alvo=document.getElementById(t.dataset.ir);if(alvo)alvo.scrollIntoView({block:'start'});return}
  if(t.dataset.tab){S.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t.dataset.nav!=null){var n=+t.dataset.nav;S.ym=n?ymAdd(S.ym,n):HOJE_YM;render();return}
  if(!S.ready)return;
  if(t.dataset.del){var dp=t.dataset.del.split('|');
    if(t.dataset.sure){t.disabled=true;remover(dp[0],dp[1],dp[2]).then(function(){S.recent=S.recent.filter(function(r){return r.id!==dp[2]});toast('Lançamento apagado');render()}).catch(function(){t.disabled=false;toast('Não foi possível apagar')})}
    else{var di=findItem(dp[0],dp[1],dp[2]),varios=di&&dp[0]==='card'&&(di.rep||(di.proj&&(di.n||1)>1));t.dataset.sure='1';t.classList.add('sure');t.textContent=varios?'Apagar de todos os meses?':'Apagar?';
      setTimeout(function(){if(t.isConnected&&t.dataset.sure){delete t.dataset.sure;t.classList.remove('sure');t.innerHTML=ICDEL}},4000)}
    return}
  if(t.dataset.modo){S.modo=t.dataset.modo;S.tab='lancar';if(dlg.open)dlg.close();render();return}
  if(t.id==='q-go'){lancarRapido();return}
  if(t.dataset.fav!=null){var e2=S.hist[S.kind][t.dataset.fav.toLowerCase()];if(!e2)return;
    $('#n-d').value=e2.d;if(e2.v!=null)$('#n-v').value=Number(e2.v).toFixed(2).replace('.',',');aplicaHist('n',S.kind,e2);$('#n-v').focus();$('#n-v').select();return}
  if(t.dataset.hoje){var inp=document.getElementById(t.dataset.hoje+'-dt');var d=new Date();inp.value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());return}
  if(t.id==='n-go'){lancar();return}
  if(t.dataset.undo){var p=t.dataset.undo.split('|');remover(p[0],p[1],p[2]).then(function(){S.recent=S.recent.filter(function(r){return r.id!==p[2]});toast('Lançamento desfeito');render()}).catch(function(){toast('Não foi possível desfazer')});return}
  if(t.dataset.edit){var q=t.dataset.edit.split('|');abrirDlg(q[0],q[1],q[2]);return}
  if(t.dataset.add){abrirDlg(t.dataset.add,S.ym,null,t.dataset.b?{b:t.dataset.b}:null);return}
  if(t.dataset.goto){S.ym=t.dataset.goto;S.tab='mes';render();window.scrollTo(0,0);return}
  if(t.dataset.saldo!=null){var v=Math.round(parseFloat(t.dataset.saldo)*100)/100;t.disabled=true;
    mutate(S.ym,function(d){d.rec.unshift({id:uid(),d:'Saldo anterior',t:'Saldo anterior',v:v})}).then(function(){toast('Saldo anterior adicionado');render()}).catch(function(){t.disabled=false;toast('Não foi possível salvar')});return}
  if(t.id==='salvaNotas'){var txt=$('#notas').value;mutate(S.ym,function(d){d.notas=txt}).then(function(){toast('Anotações salvas')}).catch(function(){toast('Não foi possível salvar')});return}
  if(t.id==='e-cancel'){dlg.close();return}
  if(t.id==='e-ok'){salvarDlg();return}
  if(t.id==='e-del'){if(t.dataset.sure){remover(dlg.dataset.k,dlg.dataset.ym,dlg.dataset.id).then(function(){dlg.close();toast('Lançamento apagado');render()}).catch(function(){$('#e-err').textContent='Não foi possível apagar.'})}
    else{t.dataset.sure='1';t.textContent='Confirmar: apagar'}return}
});
function aplicaHist(ctx,kind,e){
  var c=document.getElementById(ctx+'-c');
  if(c&&kind==='desp'&&e.c)c.value=e.c;if(c&&kind==='rec'&&e.t)c.value=e.t;
  if(e.b&&(kind==='desp'||kind==='card')){var r=document.querySelector('input[name="'+ctx+'-b"][value="'+e.b.replace(/"/g,'')+'"]');if(r)r.checked=true}
}
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='kind'){S.kind=t.value;render();return}
  if(t.name==='q-pg'){var nt=$('#q-nota'),cx2=$('#q-cardx'),ehc=t.value.indexOf('card:')===0;if(nt)nt.hidden=!ehc;if(cx2)cx2.hidden=!ehc;return}
  if(t.id==='q-d'){var hq=S.hist.desp[t.value.trim().toLowerCase()],qc=$('#q-c');if(hq&&hq.c&&qc&&!qc.value)qc.value=hq.c;return}
  if(t.id==='n-d'||t.id==='e-d'){var ctx=t.id[0],kind=ctx==='n'?S.kind:dlg.dataset.k,h=(S.hist[kind]||{})[t.value.trim().toLowerCase()];
    if(h&&ctx==='n'){aplicaHist(ctx,kind,h)}return}
  if(t.id==='n-c'||t.id==='e-c'){var nw=document.getElementById(t.id+'new');if(nw){nw.hidden=t.value!=='__new';if(!nw.hidden)nw.focus()}return}
  if(t.dataset&&t.dataset.pago){var id=t.dataset.pago,val=t.checked;mutate(S.ym,function(d){if(id.indexOf('c:')===0){d.anaPago=d.anaPago||{};if(val)d.anaPago[id.slice(2)]=true;else delete d.anaPago[id.slice(2)]}else d.receber.forEach(function(x){if(x.id===id)x.pago=val})}).then(render).catch(function(){t.checked=!val;toast('Não foi possível salvar')});return}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;var t=e.target;
  if(t.matches('[data-edit],[data-goto]')){t.click();return}
  if(t.closest('#nform')&&t.tagName==='INPUT'){e.preventDefault();lancar();return}
  if(t.id&&t.id.indexOf('q-')===0&&t.tagName==='INPUT'){e.preventDefault();lancarRapido()}
});

/* ---------- interações do painel ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-novo],[data-ltab],[data-cat],[data-dia],[data-ord],[data-cf],[data-qcat]');if(!t||!S.ready)return;
  if(t.hasAttribute('data-novo')){if(window.innerWidth<760){S.tab='lancar';S.modo='rapido';render();window.scrollTo(0,0)}else abrirRapido();return}
  if(t.dataset.qcat!=null){var s=$('#q-c');if(s){s.value=s.value===t.dataset.qcat?'':t.dataset.qcat;marcaCat()}return}
  if(S.tab!=='mes')return;
  if(t.dataset.ltab){S.ui.tabL=t.dataset.ltab;if(t.dataset.ltab!=='desp'&&t.dataset.ltab!=='all')S.ui.cat=null;renderMes();return}
  if(t.dataset.dia){S.ui.dia=S.ui.dia===t.dataset.dia?null:t.dataset.dia;renderMes();return}
  if(t.dataset.cat!=null){S.ui.cat=S.ui.cat===t.dataset.cat?null:t.dataset.cat;if(S.ui.cat)S.ui.tabL='desp';renderMes();return}
  if(t.hasAttribute('data-ord')){S.ui.ord=S.ui.ord==='val'?'rec':'val';renderMes();return}
  if(t.dataset.cf){var p=t.dataset.cf.split('|');S.ui.cf[p[0]]=p[1];renderMes();return}
});
document.addEventListener('input',function(e){
  if(e.target.id==='busca'){S.ui.q=e.target.value.trim();var l=$('#lista');if(l)l.innerHTML=listaLanc()}
});
document.addEventListener('change',function(e){
  if(/-ana$/.test(e.target.name||'')){var bx=document.getElementById(e.target.name+'box');if(bx)bx.hidden=e.target.value!=='1'}
  if(e.target.id==='q-c')marcaCat();
  if(e.target.id==='q-dt'){var m=$('#q-mes');if(m)m.textContent=e.target.value?'Entra em '+ymLabel(e.target.value.slice(0,7))+'.':'Sem data: entra em '+ymLabel(HOJE_YM)+'.'}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.matches&&e.target.matches('li[data-cat]'))e.target.click()});
function fatia(p,on){var s=p.ownerSVGElement;if(!s)return;var a=s.querySelector('.dc1'),b=s.querySelector('.dc2');if(!a||!b)return;
  if(on){var n=p.dataset.n;a.textContent=(n.length>15?n.slice(0,14)+'…':n)+' '+p.dataset.p;b.textContent=p.dataset.v}else{a.textContent='Total';b.textContent=s.dataset.t}}
document.addEventListener('mouseover',function(e){var p=e.target.closest&&e.target.closest('path[data-slice]');if(p)fatia(p,true)});
document.addEventListener('mouseout',function(e){var p=e.target.closest&&e.target.closest('path[data-slice]');if(p)fatia(p,false)});

var IC_SOL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    IC_LUA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function temaAtual(){var t=document.documentElement.getAttribute('data-theme');if(t==='dark'||t==='light')return t;return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
function pintaTema(){var b=$('.tema');if(b)b.innerHTML=temaAtual()==='dark'?IC_SOL:IC_LUA}
document.addEventListener('click',function(e){var t=e.target.closest('[data-tema]');if(!t)return;var n=temaAtual()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);lsSet('fin-tema',n);pintaTema()});
(function(){var st=lsGet('fin-tema');if(st==='dark'||st==='light')document.documentElement.setAttribute('data-theme',st);pintaTema()})();
function init(){
  render();
  if(!window.claude||!window.claude.use){S.err='semdb';render();return}
  Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
    var user=r[0],d=r[1];if(!user||!d)throw {semdb:1};
    return user.id().then(function(id){if(!id)throw {semdb:1};db=d;col=db.collection('data/users/'+id);return col.get()});
  }).then(function(snap){
    snap.docs.forEach(function(x){var v=x.data();if(!v)return;
      if(x.id==='config'){['cats','tipos','bancos','cartoes'].forEach(function(k){if(Array.isArray(v[k])&&v[k].length)S.cfg[k]=v[k].slice()})}
      else if(x.id.indexOf('m-')===0)S.docs[x.id.slice(2)]=norm(clone(v))});
    S.ready=true;buildHist();render();
  }).catch(function(e){S.err=(e&&e.semdb)?'semdb':'load';render()});
}
window.__fin={S:S};
init();
})();
